  <script>
    // Apply the saved or system theme before the first paint, so the page never flashes.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('wamr3d-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePref = pref;
    })();
  </script>
