[package]
name = "wamr-objects"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Built-in geometries, scene objects, cameras, and lights for WAMR3D"

[dependencies]
wamr-core = { path = "../core" }
wamr-math = { path = "../math" }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lib]
doctest = false
